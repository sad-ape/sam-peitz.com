<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfaf6">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Memory Pond</title>
<meta name="description" content="A pond to drop your memories into.">
<script>
  // Day or dark before anything shows, so Safari's bars take the right colour from the start (the
  // pond's own code arrives a moment later and keeps it after): the sun's height where the
  // visitor's clock says they are, as pond.js works it out.
  (() => {
    const date = new Date();
    const jan = new Date(date.getFullYear(), 0, 1).getTimezoneOffset(), jul = new Date(date.getFullYear(), 6, 1).getTimezoneOffset();
    const longitude = -Math.max(jan, jul) / 4, latitude = (jan < jul ? -35 : 48) * Math.PI / 180;
    const day = (Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()) - Date.UTC(date.getUTCFullYear(), 0, 0)) / 86400000;
    const declination = -23.44 * Math.PI / 180 * Math.cos(2 * Math.PI / 365 * (day + 10));
    const hourAngle = ((date.getUTCHours() + date.getUTCMinutes() / 60 + longitude / 15) - 12) * 15 * Math.PI / 180;
    const height = Math.asin(Math.sin(latitude) * Math.sin(declination) + Math.cos(latitude) * Math.cos(declination) * Math.cos(hourAngle));
    if (height * 180 / Math.PI < -4) {
      const root = document.documentElement;
      root.dataset.dark = '1';
      root.style.setProperty('--page', 'rgb(16,20,32)');
      root.style.setProperty('--ink', 'rgb(145,152,166)');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', 'rgb(16,20,32)');
    }
  })();
</script>
<style>
  /* One look on purpose: warm white paper by day, the app's night paper in the dark, the app's own
     pond, the app's grey mono labels. pond.js sets --page and --ink to its canvas's own colours. */
  :root {
    --page: #fcfaf6;
    --ink: #5e5e5e;
    color-scheme: light;
  }
  :root[data-dark="1"] { color-scheme: dark; }
  /* One screen that never scrolls, so a finger in the water moves the water. */
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--page); }
  body {
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
    background: var(--page);
    color: var(--ink);
    font: 500 12px/1.7 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-font-smoothing: antialiased;
  }
  /* The pond, live: the app's own water, in the middle of the screen (the canvas is the whole
     screen; its page colour, its clouds' shadows and its haze fade into the page at the edges). */
  .pond {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* The name at the top and the one line at the bottom, both centred. */
  .top, .bottom {
    position: absolute;
    z-index: 2;
    left: max(24px, env(safe-area-inset-left, 0px));
    right: max(24px, env(safe-area-inset-right, 0px));
    text-align: center;
    pointer-events: none;
  }
  .top { top: calc(env(safe-area-inset-top, 0px) + 24px); }
  .bottom { bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); }
  p { margin: 0; text-wrap: pretty; }
  .name { margin: 0; font-size: inherit; line-height: 0; }
  .wordmark { display: inline-block; }
  /* Film grain, laid over the pond's colours only: soft light leaves the paper as it is, so the
     page meets the browser's bars without an edge. */
  .grain {
    position: fixed;
    inset: -120px;
    z-index: 1;
    pointer-events: none;
    opacity: .28;
    mix-blend-mode: soft-light;
    animation: grain 1s steps(1) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0, 0) }
    10% { transform: translate(-31px, 17px) }
    20% { transform: translate(23px, -41px) }
    30% { transform: translate(-47px, -9px) }
    40% { transform: translate(11px, 37px) }
    50% { transform: translate(-19px, -27px) }
    60% { transform: translate(43px, 13px) }
    70% { transform: translate(-7px, 47px) }
    80% { transform: translate(29px, -19px) }
    90% { transform: translate(-41px, 31px) }
  }
  @media (prefers-reduced-motion: reduce) { .grain { animation: none } }
</style>
</head>

  <p class="line">A pond to drop your memories into.</p>

<div class="grain" aria-hidden="true"></div>

<script>
  // The grain: one small tile of noise round the middle grey, drawn here instead of shipped.
  (() => {
    const size = 128, tile = document.createElement('canvas');
    tile.width = tile.height = size;
    const pen = tile.getContext('2d'), noise = pen.createImageData(size, size), d = noise.data;
    for (let i = 0; i < d.length; i += 4) {
      d[i] = d[i + 1] = d[i + 2] = 64 + Math.random() * 128 | 0;
      d[i + 3] = 255;
    }
    pen.putImageData(noise, 0, 0);
    const grain = document.querySelector('.grain');
    grain.style.backgroundImage = `url(${tile.toDataURL()})`;
    grain.style.backgroundSize = `${size / Math.min(2, window.devicePixelRatio || 1)}px`;
  })();
</script>
<script type="module">
  // The pond comes encrypted: the key is the link's end (after #), never stored here.
  const canvas = document.querySelector('.pond');
  try {
    const hex = location.hash.slice(1);
    if (!/^[0-9a-f]{64}$/.test(hex)) throw new Error('no key');
    const key = await crypto.subtle.importKey('raw', new Uint8Array(hex.match(/../g).map((b) => parseInt(b, 16))), 'AES-GCM', false, ['decrypt']);
    const data = new Uint8Array(await (await fetch('pond.bin', { cache: 'no-cache' })).arrayBuffer());
    const code = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
    const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    const { startPond } = await import(url);
    URL.revokeObjectURL(url);
    window.pond = startPond(canvas, undefined, { clock: document.querySelector('.clock'), switcher: document.querySelector('.switch'), onError: () => { canvas.hidden = true; } });
  } catch { canvas.hidden = true; }
</script>
