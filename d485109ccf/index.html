<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfaf6">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Memory Pond</title>
<meta name="description" content="Memory Pond: a place to drop your memories into.">
<style>
  /* One look on purpose: warm white paper by day, the app's night paper in the dark, the app's own
     pond, the app's grey mono labels. pond.js sets --page and --ink to its canvas's own colours. */
  :root {
    --page: #fcfaf6;
    --ink: #5e5e5e;
    color-scheme: light;
  }
  :root[data-dark="1"] { color-scheme: dark; }
  /* One screen that never scrolls, so a finger in the water moves the water. */
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--page); }
  body {
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
    background: var(--page);
    color: var(--ink);
    font: 500 12px/1.7 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-font-smoothing: antialiased;
  }
  /* The pond, live: the app's own water, in the middle of the screen (the canvas is the whole
     screen; its page colour, its clouds' shadows and its haze fade into the page at the edges). */
  .pond {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* Round the pond, its pads and its cattails, as a browser's inspector draws elements (sam-peitz.com's
     boxes; Sam's Figma: a 1.5 pt blue line inside the box, no wash), each tag on a chip on the top left
     corner. pond.js puts each box where its thing is (the pads' and the cattails' move with them).
     Hidden until pond.js has placed it. */
  .box {
    position: absolute;
    z-index: 2;
    box-sizing: border-box;
    border: 1.5px solid #0702ff;
    pointer-events: none;
    visibility: hidden;
  }
  /* The pond's own box lies at the water's level (Sam): pond.js draws its line in the canvas, under
     the cattails; here it holds only the tag. */
  .box[data-of="pond"] { border-color: transparent; }
  /* The chip reaches down over the box's top line, so the two always meet - no hairline between. */
  .box::before {
    content: attr(data-tag);
    position: absolute;
    left: -1.5px;
    bottom: 100%;
    padding: 2px 4px 4.5px;
    font: 10px/11px ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    color: #fff;
    background: #0702ff;
    white-space: nowrap;
  }
  /* What Safari tints its bars from: since Safari 26 it ignores theme-color and takes the colour of
     what's fixed at the screen's top and bottom edges (and not again when the page's own background
     changes). So two thin strips there, in the page's colour, masked invisible: as day and dark
     switch, pond.js recolours them and the bars follow. */
  .tint {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: 89%;
    height: 11px;
    background: var(--page);
    pointer-events: none;
    z-index: 999;
    -webkit-mask-image: linear-gradient(to right, transparent, transparent);
    mask-image: linear-gradient(to right, transparent, transparent);
  }
  .tint.at-top { top: 4px; }
  .tint.at-bottom { bottom: 3px; }
  /* Film grain, laid over the pond's colours only: soft light leaves the paper as it is, so the
     page meets the browser's bars without an edge. */
  .grain {
    position: fixed;
    inset: -120px;
    z-index: 1;
    pointer-events: none;
    opacity: .28;
    mix-blend-mode: soft-light;
    animation: grain 1s steps(1) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0, 0) }
    10% { transform: translate(-31px, 17px) }
    20% { transform: translate(23px, -41px) }
    30% { transform: translate(-47px, -9px) }
    40% { transform: translate(11px, 37px) }
    50% { transform: translate(-19px, -27px) }
    60% { transform: translate(43px, 13px) }
    70% { transform: translate(-7px, 47px) }
    80% { transform: translate(29px, -19px) }
    90% { transform: translate(-41px, 31px) }
  }
  @media (prefers-reduced-motion: reduce) { .grain { animation: none } }
</style>
</head>
<body>

<canvas class="pond" aria-label="The pond from Memory Pond: touch the water"></canvas>
<!-- The pond as a browser's inspector shows its elements (the Easter egg on Sam's own site): each box
     outlined in blue, its tag on a chip at the top left - the tag is its name. pond.js keeps each box
     on what it's of: the pond, the lily pads as they bob, the cattails as they lean. -->
<div class="box" data-of="pond" data-tag="memory_pond" role="img" aria-label="Memory Pond"></div>
<div class="box" data-of="pad" data-tag="lily" aria-hidden="true"></div>
<div class="box" data-of="pad" data-tag="lily" aria-hidden="true"></div>
<div class="box" data-of="pad" data-tag="lily" aria-hidden="true"></div>
<div class="box" data-of="reeds" data-tag="cattail" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="tint at-top" aria-hidden="true"></div>
<div class="tint at-bottom" aria-hidden="true"></div>

<script>
  // The grain: one small tile of noise round the middle grey, drawn here instead of shipped.
  (() => {
    const size = 128, tile = document.createElement('canvas');
    tile.width = tile.height = size;
    const pen = tile.getContext('2d'), noise = pen.createImageData(size, size), d = noise.data;
    for (let i = 0; i < d.length; i += 4) {
      d[i] = d[i + 1] = d[i + 2] = 64 + Math.random() * 128 | 0;
      d[i + 3] = 255;
    }
    pen.putImageData(noise, 0, 0);
    const grain = document.querySelector('.grain');
    grain.style.backgroundImage = `url(${tile.toDataURL()})`;
    grain.style.backgroundSize = `${size / Math.min(2, window.devicePixelRatio || 1)}px`;
  })();
</script>
<script type="module">
  // The pond comes encrypted: the key is the link's end (after #), never stored here.
  const canvas = document.querySelector('.pond');
  try {
    const hex = location.hash.slice(1);
    if (!/^[0-9a-f]{64}$/.test(hex)) throw new Error('no key');
    const key = await crypto.subtle.importKey('raw', new Uint8Array(hex.match(/../g).map((b) => parseInt(b, 16))), 'AES-GCM', false, ['decrypt']);
    const data = new Uint8Array(await (await fetch('pond.bin', { cache: 'no-cache' })).arrayBuffer());
    const code = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12) }, key, data.slice(12));
    const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    const { startPond } = await import(url);
    URL.revokeObjectURL(url);
    window.pond = startPond(canvas, undefined, { clock: document.querySelector('.clock'), switcher: document.querySelector('.switch'), onError: () => { canvas.hidden = true; } });
  } catch { canvas.hidden = true; }
</script>
</body>
</html>
