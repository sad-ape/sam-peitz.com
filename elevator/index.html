<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stuck elevator</title>
<meta name="description" content="The elevator experiment has ended.">
<!-- the card a shared link shows (elevator/card.mjs draws it) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.sam-peitz.com/elevator/">
<meta property="og:title" content="Stuck elevator">
<meta property="og:description" content="The elevator experiment has ended.">
<meta property="og:image" content="https://www.sam-peitz.com/elevator/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="An elevator drawn from above in thin lines, a faded hello? on its floor and a blue answer: are you stuck too?">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* The elevator experiment has ended (24 Nov 2026). All that's left is
     outside, the page you got when you escaped through the vent: Times on
     white, the words the size the elevator's letters were, a few flowers.
     The elevator itself is in the blinds repo's history (2e2ebdd). */
  html { color-scheme: light; -webkit-text-size-adjust: 100%; }
  body { margin: 8px; background: #fff; color: #000; font-family: "Times New Roman", Times, serif;
         font-size: min(calc((100vw - 48px) * 0.0397), 14.85px);
         text-align: center;
         display: flex; flex-direction: column; justify-content: center;   /* in the middle of the window */
         min-height: calc(100vh - 16px); min-height: calc(100dvh - 16px); }
  p { margin: 0; }
  .flower { position: absolute; margin: 0; font: inherit; font-family: "Courier New", Courier, monospace; line-height: 1.15; text-align: left; }
</style>
</head>
<body>
<p class="outside">The elevator experiment has ended.<br>Enjoy your time. Go outside.</p>
<script>
// Six little flowers, scattered afresh each time round the words, clear of
// them and of each other, in turn above and below
const FLOWERS = [[' @ ', '\\|/', ' | '], [' _ ', '(_)', ' | '], [' * ', '\\|/', ' | '], ['(@)', ' | ', '\\|/'], [' o ', '\\|/', ' | ']];
function plant() {
  const words = document.querySelector('.outside').getBoundingClientRect(), placed = [];
  const keepOff = { l: words.left - 12, t: words.top - 12, r: words.right + 12, b: words.bottom + 12 };
  const hits = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
  const cx = words.left + words.width / 2, cy = words.top + words.height / 2;
  const rx = Math.min(innerWidth / 2 - 8, words.width / 2 + 110), ry = 150;
  for (let n = 0; n < 6; n++) {
    const f = document.createElement('pre');
    f.className = 'flower'; f.setAttribute('aria-hidden', 'true');
    f.textContent = FLOWERS[Math.floor(Math.random() * FLOWERS.length)].join('\n');
    document.body.append(f);
    const { width: w, height: h } = f.getBoundingClientRect();
    let spot = null;
    for (let i = 0; i < 300 && !spot; i++) {
      const x = cx + (Math.random() * 2 - 1) * rx - w / 2, y = cy + (n % 2 ? 1 : -1) * Math.random() * ry - h / 2;
      const box = { l: x, t: y, r: x + w, b: y + h };
      if (box.l < 8 || box.r > innerWidth - 8 || box.t < 8 || box.b > innerHeight - 8) continue;
      if (hits(box, keepOff) || placed.some(p => hits(box, { l: p.l - 14, t: p.t - 10, r: p.r + 14, b: p.b + 10 }))) continue;
      spot = box;
    }
    if (!spot) { f.remove(); continue; }
    placed.push(spot);
    f.style.left = spot.l + 'px'; f.style.top = spot.t + 'px';
  }
}
plant();
let plantedFor = innerWidth + 'x' + innerHeight, replant;   // turned or resized: planted again round the words where they are now
addEventListener('resize', () => {
  clearTimeout(replant);
  replant = setTimeout(() => {
    if (innerWidth + 'x' + innerHeight === plantedFor) return;
    plantedFor = innerWidth + 'x' + innerHeight;
    document.querySelectorAll('.flower').forEach(f => f.remove());
    plant();
  }, 150);
});
</script>
</body>
</html>
