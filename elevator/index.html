<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stuck elevator</title>
<meta name="description" content="You are stuck with a stranger in an elevator.">
<!-- the card a shared link shows (elevator/card.mjs draws it) -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.sam-peitz.com/elevator/">
<meta property="og:title" content="Stuck elevator">
<meta property="og:description" content="You are stuck with a stranger in an elevator.">
<meta property="og:image" content="https://www.sam-peitz.com/elevator/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="An elevator drawn from above in thin lines, a faded hello? on its floor and a blue answer: are you stuck too?">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* 1990s HTML: Times on white, the first browsers' colours (link blue, red),
     letters in Courier. Nothing anyone writes is stored, and the only thing
     reached elsewhere is the live line to the elevator server: you're here
     while the page is open, then you're gone. */
  html { color-scheme: light; -webkit-text-size-adjust: 100%; }
  body { margin: 8px; background: #fff; color: #000; font-family: "Times New Roman", Times, serif;
         font-size: var(--fs, 16px);   /* every word on the page the size of the letters on the floor */
         text-align: center; cursor: text; touch-action: manipulation;
         display: flex; flex-direction: column; justify-content: center;   /* everything in the middle of the window */
         min-height: calc(100vh - 16px); min-height: calc(100dvh - 16px); }
  p { margin: 0; }
  .say { margin-bottom: 14px; }
  a { color: #0000EE; cursor: pointer; }
  a:active { color: #FF0000; }
  .about { max-width: 21em; margin: 12px auto 0; }
  .links a + a { margin-left: 1em; }
  .flowers { align-self: center; margin: 2em 0 0; font: inherit; font-family: "Courier New", Courier, monospace; line-height: 1.15; text-align: left; }
  .outside { display: flex; align-items: flex-end; justify-content: center; gap: 1.2em; }
  .outside .flowers { margin: 0; align-self: auto; }
  .count { color: #FF0000; }
  .spin { font-family: "Courier New", Courier, monospace; }
  .flash { animation: blink 0.5s steps(1) 6; }
  @keyframes blink { 50% { visibility: hidden; } }
  /* the elevator seen from above: the floor in the middle, the four walls
     going out to their tops, drawn in plain lines */
  .car { position: relative; margin: 40px auto; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .car svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .car path { fill: none; stroke: #000; stroke-width: 1px; stroke-linejoin: round; }
  .car path.hit { fill: transparent; stroke: none; pointer-events: all; cursor: pointer; }
  /* the floor, where you stand and write, in the page's own Times: each
     letter set where it was typed (x ems across, line r down) */
  .floor { position: absolute; text-align: left; }
  .floor > * { position: absolute; left: calc(var(--x) * 1em); top: calc(var(--r) * var(--lh)); }
  .floor > .notice { left: 0; width: 100%; top: calc(50% - var(--lh)); text-align: center; transition: filter 1.5s, opacity 1.5s; }
  .floor > .notice.fade { filter: blur(5px); opacity: 0; }
  .floor span { white-space: pre; color: #000; transition: filter 1.5s, opacity 1.5s; }   /* yours in black, theirs in link blue */
  .floor span.fade { filter: blur(5px); opacity: 0; }
  .floor .them { color: #0000EE; }
  .caret { width: 0; height: var(--lh); border-left: 2px solid #000; animation: blink 1.06s steps(1) infinite; }
  .caret.them { border-color: #0000EE; }
  /* what the keyboard types into: invisible, standing where you write */
  .keys { width: 1px; height: 1px; margin: 0; padding: 0; border: 0; opacity: 0; resize: none; overflow: hidden;
          font-size: 16px; color: transparent; background: transparent; caret-color: transparent; }
</style>
</head>
<body>
<p><span class="count">0001</span> <span class="who">person is</span> stuck in an elevator right now</p>
<div class="car"><svg aria-hidden="true"></svg><div class="floor"><textarea class="keys" aria-label="Write in the elevator" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea></div></div>
<p class="say"></p>
<p class="links"><a href="#" class="music">music: on</a><a href="#" class="out" hidden>escape through the vent</a><a href="#" class="what" aria-label="What is this?">?</a></p>
<p class="about" hidden>You are stuck with a stranger in an elevator. Tap the floor to write. Nothing you write is stored. Be kind.<span class="total" hidden><br><br><span class="sofar"></span> people have been stuck in here so far.</span><br><br>A digital experience by <a href="https://x.com/samdape" target="_blank" rel="noopener">Sam</a>.</p>
<script>
const FLOOR_W = 15.6, ROWS = 16;   // the floor: its width in ems of the writing, its depth in lines
const S = 0.62;               // the floor's size against the walls' tops: how far down you look
const MAX_H = 460;            // px: the elevator's tallest, so it stays small on a big screen
const LIFE = 5000;            // ms a letter stays before it blurs away (1.5 s more)
const $ = s => document.querySelector(s);
const car = $('.car'), svg = $('.car svg'), floor = $('.floor'), keys = $('.keys'), say = $('.say');

// The lines, in perspective: the walls' tops round the outside, the floor in
// the middle, the corners joining them, and on the front wall the door (two
// halves) with the buttons beside it. x and y are fractions of the width and
// height across the walls' tops; v is the height up a wall (0 floor, 1 top).
function draw(W, H) {
  const k = v => 1 / (1 / S - v * (1 / S - 1));
  const pt = (x, y, v) => (W / 2 + x * (W - 1) * k(v)).toFixed(1) + ' ' + (H / 2 + y * (H - 1) * k(v)).toFixed(1);
  const ring = v => `M${pt(-.5, -.5, v)}L${pt(.5, -.5, v)}L${pt(.5, .5, v)}L${pt(-.5, .5, v)}Z`;
  const corner = (x, y) => `M${pt(x, y, 0)}L${pt(x, y, 1)}`;
  const onFront = (x0, x1, v0, v1) => `M${pt(x0, .5, v0)}L${pt(x1, .5, v0)}L${pt(x1, .5, v1)}L${pt(x0, .5, v1)}Z`;
  svg.innerHTML = `<path d="${ring(1)}${ring(0)}${corner(-.5, -.5)}${corner(.5, -.5)}${corner(.5, .5)}${corner(-.5, .5)}"/>`
    + `<path d="${onFront(-.17, .17, 0, .85)}M${pt(0, .5, 0)}L${pt(0, .5, .85)}"/>`
    + `<path d="${onFront(.25, .3, .4, .62)}"/>`
    + `<path class="hit door" d="${onFront(-.17, .17, 0, .85)}"/>`
    + `<path class="hit panel" d="${onFront(.21, .34, .15, .95)}"/>`;
}

// As big as fits, with room at the sides, never taller than MAX_H, and the
// whole page in the window's height
let em, lh;
function fit() {
  const size = fs => {
    em = fs; lh = fs * 1.2;
    const fw = FLOOR_W * em, fh = ROWS * lh, W = fw / S, H = fh / S;
    car.style.width = W + 'px'; car.style.height = H + 'px';
    Object.assign(floor.style, { fontSize: fs + 'px', lineHeight: lh + 'px', left: (W - fw) / 2 + 'px', top: (H - fh) / 2 + 'px', width: fw + 'px', height: fh + 'px' });
    car.style.setProperty('--lh', lh + 'px');
    document.documentElement.style.setProperty('--fs', fs + 'px');
    draw(W, H);
  };
  const fs = Math.min((document.documentElement.clientWidth - 48) * S / FLOOR_W, MAX_H * S / (ROWS * 1.2));
  size(fs);
  const over = document.documentElement.scrollHeight - innerHeight;   // then smaller till the page fits the window's height
  if (over > 0) size(Math.max(10, fs - over * S / (ROWS * 1.2)));
}
fit();
addEventListener('load', fit);   // again once everything has its final size
let fitW = innerWidth, fitH = innerHeight;
addEventListener('resize', () => {
  if (innerWidth !== fitW || (matchMedia('(pointer: fine)').matches && innerHeight !== fitH)) { fitW = innerWidth; fitH = innerHeight; fit(); }
});

// Letters on the floor, each where it was typed, blurring away after a while
const at = (node, x, r) => { node.style.setProperty('--x', x); node.style.setProperty('--r', r); };
const cells = new Map(), spot = (x, r) => r + ':' + x.toFixed(2);
const round2 = n => Math.round(n * 100) / 100;
const pen = document.createElement('canvas').getContext('2d'), widths = new Map();
pen.font = '100px "Times New Roman", Times, serif';
const wide = ch => { if (!widths.has(ch)) widths.set(ch, Math.round(pen.measureText(ch).width) / 100); return widths.get(ch); };   // in ems
function put(who, x, r, ch) {
  const key = spot(x, r);
  cells.get(key)?.remove();
  const s = document.createElement('span');
  s.textContent = ch;
  if (who === 'them') s.className = 'them';
  at(s, x, r);
  floor.append(s);
  cells.set(key, s);
  setTimeout(() => s.classList.add('fade'), LIFE);
  setTimeout(() => { s.remove(); if (cells.get(key) === s) cells.delete(key); }, LIFE + 1600);
}
const caret = who => Object.assign(document.createElement('i'), { className: who === 'them' ? 'caret them' : 'caret' });
// Something happening in the elevator: written in the middle of the floor,
// blurring away like the letters
function notice(...lines) {
  const n = document.createElement('div');
  n.className = 'notice';
  lines.forEach((l, i) => { if (i) n.append(document.createElement('br')); n.append(l); });
  floor.append(n);
  setTimeout(() => n.classList.add('fade'), LIFE);
  setTimeout(() => n.remove(), LIFE + 1600);
}
const restartBlink = el => { el.style.animation = 'none'; el.offsetWidth; el.style.animation = ''; };

// The story line, like an adventure game's
let together = false, full = false, sayTimer;
const spin = Object.assign(document.createElement('span'), { className: 'spin' });
let spinFrame = 0;
setInterval(() => { spin.textContent = '|/-\\'[spinFrame++ % 4]; }, 150);
function status() {
  say.className = 'say';
  if (full) say.textContent = 'The building is full. Try again in a minute.';
  else if (together) say.textContent = 'Someone is stuck in here with you.';
  else { say.textContent = 'You are alone. Waiting for someone to be stuck with '; say.append(spin); }
}
function tell(text, flash) {
  clearTimeout(sayTimer);
  say.className = 'say';
  say.textContent = text;
  if (flash) { say.offsetWidth; say.className = 'say flash'; }
  sayTimer = setTimeout(status, 3500);
}
status();
const setCount = n => { $('.count').textContent = String(n).padStart(4, '0'); $('.who').textContent = n === 1 ? 'person is' : 'people are'; };

// The other side, over the live line (below): where you stand, a letter, a
// letter taken back
const net = { send() {} };

// You: standing in the middle to begin with, the caret blinking; tap
// anywhere in the elevator to stand there (on the floor) and write
const me = { x: 5.4, r: 7, start: 5.4 };
let trail = [];   // where each of your letters went, for backspace
const mine = caret('me');
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
function moveMine(announce = true) {   // a letter already tells them where you are
  at(mine, me.x, me.r);
  at(keys, me.x, me.r);
  if (!mine.isConnected) floor.append(mine);
  restartBlink(mine);
  if (announce) net.send({ t: 'at', x: me.x, r: me.r });
}
moveMine();
car.addEventListener('click', e => {
  if (e.target.classList.contains('door')) return tell('The door won’t open.');
  if (e.target.classList.contains('panel')) return tell('You press the alarm. Nothing happens.');
  const b = floor.getBoundingClientRect();
  me.x = me.start = round2(clamp((e.clientX - b.left) / em, 0, FLOOR_W - 0.5));
  me.r = clamp(Math.floor((e.clientY - b.top) / lh), 0, ROWS - 1);
  trail = [];
  moveMine();
  keys.focus();
});
function newline() {
  if (me.start > FLOOR_W - 3) me.start = 0;
  me.x = me.start;
  me.r = (me.r + 1) % ROWS;
}
function type(ch) {
  trail.push({ x: me.x, r: me.r });
  if (trail.length > 300) trail.shift();
  if (ch === '\n' || ch === '\r') { newline(); return moveMine(); }
  const w = wide(ch);
  let jumped = !ch.trim();
  if (me.x + w > FLOOR_W) { newline(); trail[trail.length - 1] = { x: me.x, r: me.r }; jumped = true; }
  if (ch.trim()) { put('me', me.x, me.r, ch); net.send({ t: 'char', x: me.x, r: me.r, ch }); }
  me.x = round2(me.x + w);
  moveMine(jumped);
}
function back() {
  const p = trail.pop();
  if (!p) return;
  me.x = p.x; me.r = p.r;
  const key = spot(p.x, p.r), s = cells.get(key);
  if (s && !s.classList.contains('them')) { s.remove(); cells.delete(key); }
  net.send({ t: 'del', x: p.x, r: p.r });
  moveMine(false);
}
// The keyboard types into a textarea holding one space, so that even
// backspace makes an input event; every keystroke is read and the space put back
const reset = () => { keys.value = ' '; keys.setSelectionRange(1, 1); };
reset();
keys.addEventListener('focus', reset);
keys.addEventListener('input', e => {
  if (e.isComposing) return;
  if (e.inputType?.startsWith('delete')) back();
  else for (const ch of (e.data ?? keys.value.slice(1))) type(ch);
  reset();
});
keys.addEventListener('compositionend', e => { for (const ch of e.data || '') type(ch); reset(); });
keys.addEventListener('keydown', e => {
  const step = { ArrowLeft: [-.5, 0], ArrowRight: [.5, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (step) {
    e.preventDefault();
    me.x = me.start = round2(clamp(me.x + step[0], 0, FLOOR_W - 0.5));
    me.r = clamp(me.r + step[1], 0, ROWS - 1);
    trail = [];
    moveMine();
  }
  if (e.key === 'Escape') keys.blur();
});
// On a computer you can just start typing
document.addEventListener('keydown', e => {
  if (outside || document.activeElement !== document.body || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.length === 1 || e.key === 'Enter' || e.key === 'Backspace') {
    e.preventDefault();
    keys.focus();
    if (e.key === 'Backspace') back(); else type(e.key === 'Enter' ? '\n' : e.key);
  }
});

// The live line: everyone with the page open waits in one lobby on the
// elevator server (Supabase Realtime, in a project of its own). People on
// their own are paired, each pair in an elevator of its own (a channel) that
// carries their letters, where they stand and a goodbye. The server keeps
// none of it. The key is the project's public one, made to sit in web pages;
// the server only opens the lobby and elevators named room.<32 hex> (private
// channels; the rules are in elevator/supabase/migrations), and each
// elevator's name is a secret only its two people can work out (below).
const LINE = 'wss://kcwxlmzeorhuhqjqxuxv.supabase.co/realtime/v1/websocket?vsn=1.0.0&apikey=';
const HELLO = 'https://kcwxlmzeorhuhqjqxuxv.supabase.co/rest/v1/rpc/elevator_hello';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtjd3hsbXplb3JodWhxanF4dXh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzODEzNTgsImV4cCI6MjExMDk1NzM1OH0.LIy76o3Yr5LBbV7JvFlRIoAXGPXvUh-cfR7KTIV68to';
const LOBBY = 'realtime:lobby';
const REST = 3000;            // ms after someone leaves before someone new can drop in (short: nobody should be alone long)
const theirs = caret('them');
let ws = null, seq = 0, myId = '', since = 0, inLobby = false, counted = false, metBefore = false;
let lobby = new Map(), room = null, roomJoin = null, partner = null, trying = null, tryingTag = '', restUntil = 0, restTimer, tryTimer;

const wire = (topic, event, payload) => { const ref = String(++seq); if (ws?.readyState === 1) ws.send(JSON.stringify({ topic, event, payload, ref })); return ref; };
const join = topic => wire(topic, 'phx_join', { config: { broadcast: { self: false, ack: false }, presence: { key: myId, enabled: true }, private: true }, access_token: KEY });
const track = (topic, meta) => wire(topic, 'presence', { type: 'presence', event: 'track', payload: meta });
const shout = (event, payload = {}) => { if (room) wire(room, 'broadcast', { type: 'broadcast', event, payload }); };

// A secret elevator for each pair: everyone shows a public key in the lobby,
// and the two of a pair each combine the other's with their own private one
// (ECDH), getting the same secret - the elevator's name, plus a short tag that
// says "I'm in our elevator" without giving the name away. Nobody else can.
let pair = null, myKey = '';
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
const secrets = new Map();
async function elevatorWith(theirKey) {
  if (!secrets.has(theirKey)) {
    const pub = await crypto.subtle.importKey('raw', unb64(theirKey), { name: 'ECDH', namedCurve: 'P-256' }, false, []);
    const h = hex(await crypto.subtle.digest('SHA-256', await crypto.subtle.deriveBits({ name: 'ECDH', public: pub }, pair.privateKey, 256)));
    secrets.set(theirKey, { name: h.slice(0, 32), tag: h.slice(32, 40) });
  }
  return secrets.get(theirKey);
}

async function connect() {
  pair = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveBits']);   // fresh each time: leave and you're gone
  myKey = b64(await crypto.subtle.exportKey('raw', pair.publicKey)); secrets.clear();
  myId = [...crypto.getRandomValues(new Uint8Array(6))].map(b => b.toString(16).padStart(2, '0')).join('');
  since = Date.now(); inLobby = false; lobby.clear(); room = partner = trying = null;
  const sock = ws = new WebSocket(LINE + KEY);
  sock.onopen = () => join(LOBBY);
  sock.onmessage = e => { if (sock === ws) hear(JSON.parse(e.data)); };
  sock.onclose = () => {
    if (sock !== ws) return;
    const was = inLobby;
    ws = null; inLobby = false; lobby.clear();
    if (partner || trying) leftAlone(false);
    setCount(1);
    if (!was) { full = true; status(); }   // never got in: too many people (or no connection)
    setTimeout(connect, was ? 2000 : 60000);
  };
}
setInterval(() => wire('phoenix', 'heartbeat', {}), 25000);

function hear({ topic, event, payload, ref }) {
  // A closed elevator is only ever the echo of leaving one (and can arrive after
  // stepping back into the same one), so it's ignored; a broken one counts as
  // the other person gone if you were together, else you just try again
  if (event === 'phx_close') { if (topic === LOBBY) ws?.close(); return; }
  if (event === 'phx_error') {
    if (topic === LOBBY) ws?.close();
    else if (topic === room) { if (partner) leftAlone(true); else { room = trying = null; clearTimeout(tryTimer); soon(); } }
    return;
  }
  const presence = event === 'presence_state' || event === 'presence_diff';
  const joins = presence ? (event === 'presence_state' ? payload : payload.joins) : {}, leaves = event === 'presence_diff' ? payload.leaves : {};
  if (topic === LOBBY) {
    if (event === 'phx_reply' && !inLobby) {
      if (payload?.status !== 'ok') return ws?.close();   // turned away
      inLobby = true; full = false; status();
      track(LOBBY, { t: since, room: null, k: myKey });
      if (!counted) {   // once a visit: one more person stuck in here so far
        counted = true;
        fetch(HELLO, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: '{}' })
          .then(r => r.ok ? r.json() : null).then(n => { if (typeof n === 'number') setSoFar(n); }).catch(() => {});
      }
    } else if (presence) {
      // Each person is a key with one or more entries (an update adds the new
      // one and drops the old, sometimes in two messages): a person is gone
      // only when their last entry is
      if (event === 'presence_state') lobby.clear();
      for (const k in joins) { const e = lobby.get(k) || new Map(); for (const m of joins[k].metas) e.set(m.phx_ref, m); lobby.set(k, e); }
      for (const k in leaves) { const e = lobby.get(k); if (!e) continue; for (const m of leaves[k].metas) e.delete(m.phx_ref); if (!e.size) lobby.delete(k); }
      setCount(Math.max(1, lobby.size));
      soon();
    }
  } else if (topic === room) {
    if (event === 'phx_reply') { if (ref === roomJoin && payload?.status === 'ok') track(room, {}); }   // in: now be seen there
    else if (presence) {
      if (trying && joins[trying]) paired();
      else if (partner && leaves[partner] && !joins[partner]) leftAlone(true);
    } else if (event === 'broadcast') fromThem(payload.event, payload.payload);
  }
}
// Who goes with whom: everyone on their own, longest waiting first, taken in
// twos. Every page works it out from the same lobby, so both of a pair choose
// each other and meet in their elevator. Whenever the lobby changes, a page
// that's waiting for someone checks its choice again and lets go at once if
// it's changed (that person got stuck with someone else, or left); 5 s
// without meeting is the last resort.
// news of the lobby comes in bursts: decide once it has settled a moment
let matchTimer;
const soon = () => { clearTimeout(matchTimer); matchTimer = setTimeout(match, 200); };
const metaOf = k => { const e = lobby.get(k); return e && [...e.values()].at(-1); };
function partnerFor() {
  const alone = [...lobby].map(([k, e]) => [k, [...e.values()].at(-1)]).filter(([, m]) => m.room === null && m.k)
    .sort((a, b) => a[1].t - b[1].t || (a[0] < b[0] ? -1 : 1)).map(([k]) => k);
  const i = alone.indexOf(myId);
  return i < 0 ? null : alone[i % 2 ? i - 1 : i + 1] || null;
}
async function match() {
  if (!inLobby || partner || Date.now() < restUntil) return;
  if (trying && metaOf(trying)?.with === tryingTag) return paired();   // their news in the lobby beat their arrival in our elevator
  const want = partnerFor();
  if (trying && want === trying) return;   // still the right one: keep waiting for them
  if (trying) { wire(room, 'phx_leave', {}); room = trying = null; clearTimeout(tryTimer); }
  if (!want) return;
  const sock = ws;
  let secret;
  try { secret = await elevatorWith(metaOf(want).k); } catch { return; }
  if (ws !== sock || !inLobby || partner || trying || partnerFor() !== want) return;   // things moved on meanwhile
  trying = want; tryingTag = secret.tag; room = 'realtime:room.' + secret.name;
  roomJoin = join(room);
  const r = room;
  tryTimer = setTimeout(() => {
    if (room !== r || !trying) return;
    wire(r, 'phx_leave', {}); room = trying = null;
    restUntil = Date.now() + 500 + Math.random() * 1000;
    setTimeout(match, 1600);
  }, 5000);
}
function paired() {
  partner = trying; trying = null; together = true;
  clearTimeout(tryTimer);
  track(LOBBY, { t: since, room: 'busy', with: tryingTag, k: myKey });   // taken: nobody else picks either of you
  tell(metBefore ? 'Someone new dropped in through the top vent.' : 'Someone got stuck in here with you.', true);
  metBefore = true;
  $('.out').hidden = false;   // a way out, while there's someone to get away from
  shout('at', { x: me.x, r: me.r });
}
function leftAlone(show) {
  if (room) wire(room, 'phx_leave', {});
  room = partner = trying = null; together = false;
  theirs.remove();
  $('.out').hidden = true;
  restUntil = Date.now() + REST;   // a breather before someone new drops in
  if (inLobby) track(LOBBY, { t: since, room: 'resting', k: myKey });
  clearTimeout(restTimer);
  restTimer = setTimeout(() => { if (inLobby && !room) { since = Date.now(); track(LOBBY, { t: since, room: null, k: myKey }); } }, REST + 50);   // waiting from now
  if (show) notice('They escaped through the top vent.', 'You’re alone again.');

}
// Their side, checked: a letter in a cell of the floor, at most forty a second
let heard = 0, heardAt = 0;
function fromThem(ev, d) {
  if (!partner || !d) return;
  const now = Date.now();
  if (now - heardAt > 1000) { heardAt = now; heard = 0; }
  if (++heard > 40) return;
  if (ev === 'bye') return leftAlone(true);
  const { r, ch } = d, x = round2(d.x);
  if (!Number.isFinite(x) || !Number.isInteger(r) || x < 0 || x > FLOOR_W || r < 0 || r >= ROWS) return;
  if (ev === 'char') {
    if (typeof ch !== 'string' || [...ch].length !== 1 || /[\u0000-\u001f\u007f-\u009f]/.test(ch)) return;
    put('them', x, r, ch);
    at(theirs, Math.min(round2(x + wide(ch)), FLOOR_W), r);
  } else if (ev === 'del') {
    const key = spot(x, r), s = cells.get(key);
    if (s && s.classList.contains('them')) { s.remove(); cells.delete(key); }
    at(theirs, x, r);
  } else if (ev === 'at') at(theirs, x, r);
  else return;
  if (!theirs.isConnected) floor.append(theirs);
  restartBlink(theirs);
}
// Your side: at most twenty a second, which keeps the line (and the bill) small
let sent = 0, sentAt = 0;
net.send = ({ t, x, r, ch }) => {
  if (!partner) return;
  const now = Date.now();
  if (now - sentAt > 1000) { sentAt = now; sent = 0; }
  if (++sent > 20) return;
  shout(t, ch ? { x, r, ch } : { x, r });
};
addEventListener('pagehide', () => {
  if (partner) shout('bye');
  if (room) wire(room, 'phx_leave', {});
  wire(LOBBY, 'phx_leave', {});
  ws?.close();
});
connect();

// The ? : what this is, and (once the elevator server counts them) how many
// people have been stuck in here so far
$('.what').addEventListener('click', e => { e.preventDefault(); $('.about').hidden = !$('.about').hidden; });
const setSoFar = n => { $('.sofar').textContent = n.toLocaleString('en-US'); $('.total').hidden = false; };

// Elevator music: an original little bossa nova, made up here and played by
// the page itself through a small ceiling speaker (no deep bass, no air),
// very quiet. Browsers only allow sound after a tap, so it starts on your first.
function makeBand(ctx, dest) {
  const beat = 60 / 88, hz = m => 440 * 2 ** ((m - 69) / 12);
  const bus = ctx.createGain(), hp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter(), room = ctx.createConvolver(), wet = ctx.createGain();
  hp.type = 'highpass'; hp.frequency.value = 120;
  lp.type = 'lowpass'; lp.frequency.value = 3000;
  const len = ctx.sampleRate * 1.5 | 0, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 4; }
  room.buffer = ir; wet.gain.value = 0.18;
  bus.connect(hp); bus.connect(room).connect(wet).connect(hp); hp.connect(lp).connect(dest);
  const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  const env = (g, t, peak, decay, end) => {
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + 0.008);
    g.gain.setTargetAtTime(peak * 0.3, t + 0.008, decay); g.gain.setTargetAtTime(0, end, 0.1);
  };
  function piano(t, m, d, vel) {   // a soft electric piano: one sine bending another
    const f = hz(m), o = ctx.createOscillator(), mod = ctx.createOscillator(), depth = ctx.createGain(), g = ctx.createGain();
    o.frequency.value = f; mod.frequency.value = f;
    depth.gain.setValueAtTime(f * 1.1, t); depth.gain.setTargetAtTime(f * 0.1, t, 0.15);
    mod.connect(depth).connect(o.frequency); o.connect(g).connect(bus);
    env(g, t, vel, 0.35, t + d);
    o.start(t); mod.start(t); o.stop(t + d + 1); mod.stop(t + d + 1);
  }
  function bass(t, m, d) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = hz(m); o.connect(g).connect(bus);
    env(g, t, 0.2, 0.4, t + d);
    o.start(t); o.stop(t + d + 1);
  }
  function vibes(t, m, d) {        // a vibraphone: a sine, its bright fourth partial, a slow wobble
    const f = hz(m), o = ctx.createOscillator(), o4 = ctx.createOscillator(), g = ctx.createGain(), g4 = ctx.createGain();
    const wob = ctx.createOscillator(), wd = ctx.createGain(), amp = ctx.createGain();
    o.frequency.value = f; o4.frequency.value = f * 4; wob.frequency.value = 5.5; wd.gain.value = 0.2; amp.gain.value = 0.8;
    o.connect(g); o4.connect(g4).connect(g); g.connect(amp).connect(bus); wob.connect(wd).connect(amp.gain);
    g4.gain.setValueAtTime(0.25, t); g4.gain.setTargetAtTime(0, t, 0.06);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.09, t + 0.004);
    g.gain.setTargetAtTime(0, t + 0.004, 0.8); g.gain.setTargetAtTime(0, t + d, 0.15);
    for (const x of [o, o4, wob]) { x.start(t); x.stop(t + d + 1.5); }
  }
  function brush(t, vel, d) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.7;
    s.connect(f).connect(g).connect(bus);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + 0.004); g.gain.setTargetAtTime(0, t + 0.004, d);
    s.start(t, Math.random() * 0.5); s.stop(t + 0.5);
  }

  // Eight bars in F, round and round: chords (beat, beats, notes, bass root) and a tune
  const F = [57, 60, 64, 67], Em = [55, 59, 62, 64], A7 = [55, 61, 64, 69], Dm = [53, 57, 60, 64],
        G = [53, 59, 64], Gm = [58, 62, 65, 69], C = [58, 62, 64, 69], C7 = [58, 61, 64, 67];
  const chords = [[0, 4, F, 41], [4, 2, Em, 40], [6, 2, A7, 45], [8, 4, Dm, 38], [12, 4, G, 43],
                  [16, 4, Gm, 43], [20, 4, C, 36], [24, 2, F, 41], [26, 2, Dm, 38], [28, 2, Gm, 43], [30, 2, C7, 36]];
  const tune = [[0, 72, 1.5], [1.5, 69, .5], [2, 76, 2], [4, 74, 1], [5, 71, 1], [6, 73, 2],
                [8, 76, 1.5], [9.5, 74, .5], [10, 72, 1], [11, 69, 1], [12, 71, 3],
                [16, 70, 1.5], [17.5, 74, .5], [18, 77, 2], [20, 76, 1], [21, 74, 1], [22, 69, 2],
                [24, 72, 1.5], [25.5, 76, .5], [26, 74, 2], [28, 70, 2], [30, 67, 2]];
  const events = [], chordAt = b => chords.findLast(c => c[0] <= b);
  for (const [b, n, , root] of chords) {
    const steps = n === 4 ? [[0, root, 1.4], [1.5, root + 7, .4], [2, root + 7, 1.4], [3.5, root, .4]] : [[0, root, 1.4], [1.5, root + 7, .4]];
    for (const [d, m, l] of steps) events.push([b + d, t => bass(t, m, l * beat)]);
  }
  for (const block of [0, 8, 16, 24]) for (const [d, l] of [[0, .45], [1.5, .45], [3, 1.2], [5, .45], [6.5, 1.2]]) {
    const notes = chordAt(block + d)[2];
    events.push([block + d, t => notes.forEach((m, i) => piano(t + i * 0.012, m, l * beat, 0.035))]);
  }
  for (const [b, m, l] of tune) events.push([b, (t, loop) => loop % 2 === 0 && vibes(t, m, l * beat)]);   // every other time round

const VOL = 0.25;
let audio = null, out, band, next = 0, round = 0, t0 = 0, musicOn = true;
function tick() {
  if (audio?.state !== 'running') return;
  for (;;) {
    const [b, play] = band.events[next], t = t0 + b * band.beat;
    if (t > audio.currentTime + 0.3) break;
    if (t >= audio.currentTime - 0.05) play(t, round);

function fadeTo(v, s) { const now = audio.currentTime; out.gain.cancelScheduledValues(now); out.gain.setValueAtTime(out.gain.value, now); out.gain.linearRampToValueAtTime(v, now + s); }

      out = audio.createGain(); out.gain.value = 0; out.connect(audio.destination);
      band = makeBand(audio, out);
      t0 = audio.currentTime + 0.1;
      setInterval(tick, 50);
    }
    audio.resume();
    fadeTo(VOL, 4);

const musicLink = $('.music');
musicLink.addEventListener('click', e => {
  e.preventDefault();
  musicOn = !musicOn;

  music(musicOn);
});
const firstTap = () => { if (musicOn && !audio) music(true); };
document.addEventListener('click', firstTap);
document.addEventListener('keydown', firstTap);
document.addEventListener('visibilitychange', () => {
  if (!audio) return;
  if (document.hidden) audio.suspend();
  else if (musicOn) audio.resume();
});

// Escaping: through the vent and out of the building. The other person is
// told you escaped, the line is closed for good, and all that's left is outside.
var outside = false;
$('.out').addEventListener('click', e => {
  e.preventDefault();
  outside = true; musicOn = false;
  if (partner) shout('bye');
  if (room) wire(room, 'phx_leave', {});
  wire(LOBBY, 'phx_leave', {});
  const sock = ws; ws = null; sock?.close();   // closed by us: no coming back on this page
  if (audio) { fadeTo(0, 1.5); setTimeout(() => audio.suspend(), 1600); }
  document.title = 'Outside';
  document.body.innerHTML = '<div class="outside">'
    + '<pre class="flowers" aria-hidden="true"> * \n\\|/\n | </pre>'
    + '<p>You escaped the elevator.<br>You\u2019re outside. Enjoy your day.</p>'
    + '<pre class="flowers" aria-hidden="true">(@)\n | \n\\|/</pre>'
    + '</div>'
    + '<pre class="flowers" aria-hidden="true">'
    + '  @     _ \n'
    + ' \\|/   (_)\n'
    + '  |     | </pre>';
});
