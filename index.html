<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sam's Website</title>
<meta name="description" content="Sam's website.">
<!-- the tab's icon: the flower from the page -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- the card a shared link shows: the page's drawing -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.sam-peitz.com/">
<meta property="og:title" content="Sam's Website">
<meta property="og:description" content="Sam's website.">
<meta property="og:image" content="https://www.sam-peitz.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sam's Website, written by hand in blue">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffffff">
<script>
  // the page as the machine sees it: the flower in Website turns it on and
  // off (below), and ?divs opens the page with it on
  if (new URLSearchParams(location.search).has('divs')) document.documentElement.classList.add('divs');
</script>
<style>
  /* Sam's page as he drew it in Figma ("1992", 402 x 874 - a phone's whole
     screen): one drawing, website.svg, as exported. Its points are the unit
     here (--u), so the numbers below are the design's. On a phone 402 wide
     it sits where it was drawn, its top 62 under the status bar; elsewhere
     it scales to the width, or to the height from under the status bar to
     just past the flower (62 to 760), whichever is tighter, centred across. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  .page {
    --w: min(100vw, 100dvh * 402 / 698);
    --u: calc(var(--w) / 402);
    position: absolute;
    left: calc(50% - var(--w) / 2);
    top: calc(-62 * var(--u));
    width: var(--w);
  }
  .page img { display: block; width: 100%; height: auto; }
  /* the drawn title, as boxes round its words (the drawing's own bounds, a
     little padding; the boxes holding others leave room at the top for their
     children's tags) - the heading for screen readers, and something for the
     machine's view below to outline */
  .title { position: absolute; left: calc(77.2 * var(--u)); top: calc(284.9 * var(--u)); width: calc(246.8 * var(--u)); height: calc(191.3 * var(--u)); }
  .word { position: absolute; }
  .sams { left: calc(6 * var(--u)); top: calc(16 * var(--u)); width: calc(159.6 * var(--u)); height: calc(84.5 * var(--u)); }
  .site { left: calc(23.7 * var(--u)); top: calc(109.8 * var(--u)); width: calc(217.1 * var(--u)); height: calc(75.5 * var(--u)); }
  /* the flower that is Website's i: a button, a fingertip round it */
  .bloom {
    position: absolute;
    left: calc(144.6 * var(--u)); top: calc(31.9 * var(--u)); width: calc(19.9 * var(--u)); height: calc(36.3 * var(--u));
    margin: 0; padding: 0; border: 0; background: none; appearance: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .bloom::after { content: ''; position: absolute; inset: calc(-4 * var(--u)) calc(-12 * var(--u)); }
  .bloom:focus-visible { outline: 1px dotted #0000ff; }
  /* the links: a fingertip round each of X, ig, Li and the flower */
  .links { position: absolute; left: calc(75 * var(--u)); top: calc(630 * var(--u)); width: calc(222.3 * var(--u)); height: calc(123 * var(--u)); }
  .page a {
    position: absolute;
    width: calc(44 * var(--u));
    height: calc(44 * var(--u));
    border-radius: 50%;
    -webkit-tap-highlight-color: transparent;
  }
  .page a:focus-visible { outline: 1px dotted #0000ff; }
  .x { left: calc(6 * var(--u)); top: calc(18.6 * var(--u)); }
  .ig { left: calc(71.8 * var(--u)); top: calc(42 * var(--u)); }
  .li { left: calc(135.6 * var(--u)); top: calc(16 * var(--u)); }
  .flower { left: calc(172.3 * var(--u)); top: calc(73 * var(--u)); }
  .hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* The page as the machine sees it (.divs, from the flower): every box
     outlined in the drawing's blue, a faint wash inside, its tag on a chip
     sitting on its top left corner, as a browser's inspector shows them -
     fading in and out */
  .box { outline: 1px solid transparent; transition: outline-color 0.2s, background-color 0.2s; }
  .box::before {
    content: attr(data-tag);
    position: absolute;
    left: -1px;
    bottom: 100%;
    padding: 2px 4px 1px;
    font: 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: #fff;
    background: #0000ff;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .divs .box { outline-color: #0000ff; background-color: rgba(0, 0, 255, 0.03); }
  .divs .box::before { opacity: 1; }
  .divs .page a { border-radius: 0; }
</style>
</head>
<body>
<main class="page box" data-tag="main">
  <img src="website.svg" width="402" height="874" alt="">
  <div class="title box" data-tag="div" role="heading" aria-level="1">
    <div class="word sams box" data-tag="div"><span class="hidden">Sam's</span></div>
    <div class="word site box" data-tag="div"><span class="hidden">Website</span><button class="bloom box" data-tag="button" type="button" aria-label="Show the boxes" aria-pressed="false"></button></div>
  </div>
  <nav class="links box" data-tag="nav">
    <a class="x box" data-tag="a" href="https://x.com/samdape" target="_blank" rel="noopener" aria-label="X"></a>
    <a class="ig box" data-tag="a" href="https://www.instagram.com/sam.dape/" target="_blank" rel="noopener" aria-label="Instagram"></a>
    <a class="li box" data-tag="a" href="https://www.linkedin.com/in/samuel-peitz/" target="_blank" rel="noopener" aria-label="LinkedIn"></a>
    <a class="flower box" data-tag="a" href="https://apps.apple.com/us/app/one-year-daily-journal/id6740510762" target="_blank" rel="noopener" aria-label="One Year"></a>
  </nav>
</main>
<script>
  const bloom = document.querySelector('.bloom');
  const show = on => { document.documentElement.classList.toggle('divs', on); bloom.setAttribute('aria-pressed', on); };
  show(document.documentElement.classList.contains('divs'));
  bloom.addEventListener('click', () => show(!document.documentElement.classList.contains('divs')));
</script>
</body>
</html>
